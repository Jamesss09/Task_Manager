# Render blueprint.
#
# This creates both the PostgreSQL database and the API service, and wires
# DATABASE_URL between them automatically.
#
# Free plan notes (see https://render.com/docs/free):
#   - Free web services spin down after 15 idle minutes and take about a
#     minute to wake up again.
#   - Free databases expire 30 days after creation, then a 14 day grace
#     period, then Render deletes them and all data. To keep the data, change
#     the database plan below to `basic-256mb` (about $6/month).

databases:
  - name: task-manager-db
    databaseName: task_manager
    user: task_manager
    plan: free

services:
  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev matters: Render sets NODE_ENV=production, and without this
    # npm skips devDependencies, so `tsc` would be missing and the build fails.
    buildCommand: npm install --include=dev && npm run build
    # Runs the migration on every boot. It is written to be safe to re-run.
    # Doing it here rather than in the build command means the migration always
    # has network access to the database.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      # Render generates a strong random value once and keeps it.
      # Changing it later logs every user out.
      - key: JWT_SECRET
        generateValue: true
    # Optional: add CLIENT_ORIGIN in the Render dashboard once your frontend is
    # deployed, set to its URL, to lock down CORS. Without it, any origin can
    # call the API.
